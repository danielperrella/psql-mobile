plugins { id 'com.android.application' }

def signingFile = file(System.getenv('PSQL_SIGNING_PROPERTIES') ?: ((System.getenv('LOCALAPPDATA') ?: System.getProperty('user.home')) + '/PsqlMobile/signing/signing.properties'))
def signingValues = new Properties()
def publishedVersionCode = 6
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'it.psqlmobile.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'it.psqlmobile.app'
        minSdk 26
        targetSdk 35
        versionCode ((project.findProperty('releaseVersionCode') ?: publishedVersionCode).toInteger())
        versionName '1.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (!signingValues.isEmpty()) {
            distribution {
                storeFile file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        if (!signingValues.isEmpty()) {
            debug.signingConfig signingConfigs.distribution
            release.signingConfig signingConfigs.distribution
        }
    }
    sourceSets.main.assets.srcDirs = ['../../dist-android']
    packaging.resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.postgresql:postgresql:42.7.14'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
