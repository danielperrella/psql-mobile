name: Android direct PostgreSQL integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: androidtest
          POSTGRES_PASSWORD: psql-test-only
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build:android
      - name: Configure disposable PostgreSQL mutual TLS fixture
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node scripts/create-tls-fixture.mjs
          docker cp .tooling/tls-fixture "$PG_CONTAINER:/tmp/psql-tls"
          docker exec -u root "$PG_CONTAINER" sh -c 'chown -R postgres:postgres /tmp/psql-tls && chmod 600 /tmp/psql-tls/*.key'
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c 'CREATE ROLE tls_probe LOGIN'
          docker exec -u postgres "$PG_CONTAINER" sh -c 'printf "hostssl all tls_probe 0.0.0.0/0 cert\nhostssl all tls_probe ::/0 cert\n" > "$PGDATA/pg_hba.new"; cat "$PGDATA/pg_hba.conf" >> "$PGDATA/pg_hba.new"; mv "$PGDATA/pg_hba.new" "$PGDATA/pg_hba.conf"'
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c "ALTER SYSTEM SET ssl='on'"
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c "ALTER SYSTEM SET ssl_cert_file='/tmp/psql-tls/server.crt'"
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c "ALTER SYSTEM SET ssl_key_file='/tmp/psql-tls/server.key'"
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c "ALTER SYSTEM SET ssl_ca_file='/tmp/psql-tls/ca.crt'"
          docker exec -u postgres "$PG_CONTAINER" psql -U androidtest -d postgres -c 'SELECT pg_reload_conf()'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            adb reverse tcp:55432 tcp:55432
            cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.postgresUri=postgresql://androidtest:psql-test-only@127.0.0.1:55432/postgres?sslmode=disable' '-Pandroid.testInstrumentationRunnerArguments.certificateUri=postgresql://tls_probe@127.0.0.1:55432/postgres?sslmode=verify-full'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/androidTests/
